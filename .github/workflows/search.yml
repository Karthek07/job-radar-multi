name: Job search

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run search now" button in the app
  push:
    branches: [main]
    paths: ["profile/**", "engine/**", "requests/**", "uploads/**", "profiles/**", "profiles.json", "applications.json"]

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # several profiles search one after another
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state when this run starts (earlier runs may have committed meanwhile)

      # the public template (and a copy nobody has set up yet) has no resume: nothing to do, nothing to commit
      - name: Anything to search?
        id: check
        run: python3 engine/multi.py --check

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r engine/requirements.txt
        if: steps.check.outputs.run == 'true'

      - name: Claude Code (only when a Claude Pro/Max token is set)
        if: steps.check.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version; fi

      - name: Search, score and tailor
        if: steps.check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # changes made from the app (add job, interview prep, profile edits) skip the slow board search
          QUICK: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'app:') }}
        run: |
          set -o pipefail
          mkdir -p data
          if [ "$QUICK" = "true" ]; then python engine/multi.py --requests-only 2>&1 | tee data/last_run.log
          else python engine/multi.py 2>&1 | tee data/last_run.log; fi

      - name: Save results
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Job search $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push results"; exit 1
