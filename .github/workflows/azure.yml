name: Deploy to Azure

# Hosted Job Radar for an invite-only group. Needs one secret, AZURE_CREDENTIALS (see docs/AZURE.md),
# and the secret JR_ADMIN_USERS (your sign-in email; a secret so it stays out of the public logs). Job-source keys are optional secrets.

on:
  push:
    branches: [main]
    paths: ["web/**", "api/**", "infra/**", ".github/workflows/azure.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  RG: ${{ vars.JR_RESOURCE_GROUP || 'job-radar' }}

jobs:
  deploy:
    if: github.repository == 'akhileshr1122-ui/Job-radar-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        env:
          CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          ADMINS: ${{ secrets.JR_ADMIN_USERS || vars.JR_ADMIN_USERS }}
        run: |
          if [ -z "$CREDS" ]; then echo "::error::Add the AZURE_CREDENTIALS secret first (docs/AZURE.md, step 2)."; exit 1; fi
          if [ -z "$ADMINS" ]; then echo "::error::Add the JR_ADMIN_USERS secret (your sign-in email) first (docs/AZURE.md, step 3)."; exit 1; fi

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or update Azure resources
        id: infra
        env:
          ADMINS: ${{ secrets.JR_ADMIN_USERS || vars.JR_ADMIN_USERS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SHARED_ANTHROPIC_API_KEY: ${{ secrets.SHARED_ANTHROPIC_API_KEY }}
          ADMIN_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ADMIN_CLAUDE_TOKEN=$(printf '%s' "$ADMIN_CLAUDE_TOKEN" | tr -d '[:space:]')
          out=$(az deployment group create -g "$RG" -n jobradar -f infra/main.bicep \
            -p adminUsers="$ADMINS" adzunaAppId="$ADZUNA_APP_ID" adzunaAppKey="$ADZUNA_APP_KEY" \
               joobleKey="$JOOBLE_KEY" rapidApiKey="$RAPIDAPI_KEY" sharedAnthropicKey="$SHARED_ANTHROPIC_API_KEY" adminClaudeToken="$ADMIN_CLAUDE_TOKEN" \
            --query properties.outputs -o json)
          echo "web_name=$(echo "$out" | jq -r .webName.value)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(echo "$out" | jq -r .webUrl.value)" >> "$GITHUB_OUTPUT"

      - name: Get the web app deploy key
        id: key
        run: |
          k=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.web_name }}" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$k"
          echo "token=$k" >> "$GITHUB_OUTPUT"

      - name: Publish web app and API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.key.outputs.token }}
          action: upload
          app_location: web
          api_location: api
          skip_app_build: true

      - name: Start a first search
        if: github.event_name == 'workflow_dispatch'
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job start -n jobradar-bulk -g "$RG" -o none && echo "Bulk search started."

      - name: Connect your own domain
        id: domain
        if: vars.JR_DOMAIN != ''
        env:
          DOMAIN: ${{ vars.JR_DOMAIN }}
          WEB: ${{ steps.infra.outputs.web_name }}
        run: |
          host=$(echo "${{ steps.infra.outputs.web_url }}" | sed 's#https://##')
          if az staticwebapp hostname show -n "$WEB" -g "$RG" --hostname "$DOMAIN" -o none 2>/dev/null; then
            echo "status=$(az staticwebapp hostname show -n "$WEB" -g "$RG" --hostname "$DOMAIN" --query status -o tsv)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if az staticwebapp hostname set -n "$WEB" -g "$RG" --hostname "$DOMAIN" --no-wait -o none; then
            echo "status=Validating" >> "$GITHUB_OUTPUT"
          else
            echo "status=WaitingForDNS" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure couldn't see the DNS record for $DOMAIN yet. Add a CNAME record: $DOMAIN -> $host, wait 10-30 minutes, then run this workflow again."
          fi

      - name: Done
        run: |
          host=$(echo "${{ steps.infra.outputs.web_url }}" | sed 's#https://##')
          {
            echo "### Job Radar is live: ${{ steps.infra.outputs.web_url }}"
            echo "Sign in with your admin account and invite friends from Settings."
            echo ""
            echo "**Your own domain:** at your domain provider add a **CNAME** record pointing to \`$host\`, then set the repo variable \`JR_DOMAIN\` (e.g. \`jobs.ladioro.com\`) and run this workflow again."
            if [ -n "${{ vars.JR_DOMAIN }}" ]; then echo ""; echo "Domain **${{ vars.JR_DOMAIN }}**: ${{ steps.domain.outputs.status }} (HTTPS certificate is issued automatically, usually within 15 minutes)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
